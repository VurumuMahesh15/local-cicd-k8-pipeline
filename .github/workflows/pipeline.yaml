name: Deployment Report Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          echo "version=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  report:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        uses: ./.github/actions/generate-report
        with:
          env-label: ${{ matrix.environment }}
          version: ${{ needs.version.outputs.version }}

  combine:
    needs: [version, report, terraform_check]
    runs-on: ubuntu-latest
    steps:
      - name: Download bash reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: all-outputs

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          pattern: tf-output-*
          merge-multiple: true
          path: all-outputs

      - name: Combine reports
        run: |
          for file in all-outputs/*; do
            {
              echo "================================================"
              echo "SOURCE: $(basename "$file")"
              echo "================================================"
              cat "$file"
              echo
            } >> combined-report.txt
          done

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ needs.version.outputs.version }}
          path: combined-report.txt
  terraform_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    container:
      image: hashicorp/terraform:1.7
    steps:
      - uses: actions/checkout@v4

      - name: Terraform fmt check
        run: terraform -chdir=ci-cd-k8s-policy-pipeline/terraform fmt -check

      - name: Terraform init
        run: terraform -chdir=ci-cd-k8s-policy-pipeline/terraform init

      - name: Terraform validate
        run: terraform -chdir=ci-cd-k8s-policy-pipeline/terraform validate

      - name: Terraform apply
        env:
          TF_VAR_environment: ${{ matrix.environment }}
        run: terraform -chdir=ci-cd-k8s-policy-pipeline/terraform apply -auto-approve

      - name: Terraform output (JSON)
        run: terraform -chdir=ci-cd-k8s-policy-pipeline/terraform output -json > ci-cd-k8s-policy-pipeline/terraform/tf-output-${{ matrix.environment }}.json

      - name: Upload Terraform output artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-output-${{ matrix.environment }}
          path: |
            ci-cd-k8s-policy-pipeline/terraform/deployment-record-${{ matrix.environment }}.txt
            ci-cd-k8s-policy-pipeline/terraform/tf-output-${{ matrix.environment }}.json

      - name: Write terraform job summary
        run: |
          {
            echo "## Terraform Check — ${{ matrix.environment }}"
            echo ""
            echo "- Format check: ✅"
            echo "- Init: ✅"
            echo "- Validate: ✅"
          } >> "$GITHUB_STEP_SUMMARY"
  k8s-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster
          config: ci-cd-k8s-policy-pipeline/policy-enforcement/kind-config.yaml

      - name: Create namespaces
        run: |
          kubectl create namespace dev
          kubectl create namespace staging
          kubectl create namespace prod

      - name: Apply Terraform check Job
        run: kubectl apply -f ci-cd-k8s-policy-pipeline/policy-enforcement/job.yaml

      - name: Wait for Job to complete
        run: kubectl wait --for=condition=complete job/tf-check -n dev --timeout=200s

      - name: Debug - show pod status if failed
        if: failure()
        run: |
          kubectl get pods -n dev
          kubectl describe pod -n dev -l job-name=tf-check
          kubectl logs -n dev -l job-name=tf-check --all-containers=true || true

      - name: Show Job logs
        run: kubectl logs job/tf-check -n dev
